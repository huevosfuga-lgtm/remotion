<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8c86"/>
      <stop offset="1" stop-color="#6f6c66"/>
    </linearGradient>
    <radialGradient id="orange1" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#F7A32A"/>
      <stop offset="1" stop-color="#E4720B"/>
    </radialGradient>
    <radialGradient id="pale1" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FBE58A"/>
      <stop offset="1" stop-color="#EFCB4E"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg1)"/>
  <!-- counter speckle -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="180" cy="500" r="4"/><circle cx="880" cy="620" r="5"/>
    <circle cx="520" cy="1500" r="4"/><circle cx="300" cy="1650" r="5"/>
    <circle cx="820" cy="1400" r="4"/><circle cx="620" cy="480" r="4"/>
  </g>
  <!-- left bowl (pastoril / orange) -->
  <ellipse cx="330" cy="1000" rx="300" ry="300" fill="#ffffff"/>
  <ellipse cx="330" cy="1000" rx="240" ry="240" fill="url(#orange1)"/>
  <ellipse cx="330" cy="1000" rx="240" ry="60" fill="#ffffff" opacity="0.12"/>
  <!-- right bowl (industrial / pale) -->
  <ellipse cx="770" cy="1030" rx="300" ry="300" fill="#ffffff"/>
  <ellipse cx="770" cy="1030" rx="240" ry="240" fill="url(#pale1)"/>
  <ellipse cx="770" cy="1030" rx="240" ry="60" fill="#ffffff" opacity="0.18"/>
  <!-- replace tag -->
  <g transform="translate(540 210)">
    <rect x="-300" y="-46" width="600" height="92" rx="46" fill="#1A1508" opacity="0.82"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#F7E7B0" text-anchor="middle">REEMPLAZAR CON TU FOTO 1</text>
  </g>
</svg>
